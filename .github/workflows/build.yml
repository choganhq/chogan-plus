name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out with the chogan submodule
        uses: actions/checkout@v7
        with:
          submodules: true

      # Play refuses a listing over its limits (title 30, short 80, full 4000 characters), and
      # the API upload would fail only at release time, far from the edit that caused it (#11).
      - name: Check store listing lengths
        run: |
          set -euo pipefail
          N=0
          for d in fastlane/metadata/android/*/; do
            for spec in title.txt:30 short_description.txt:80 full_description.txt:4000; do
              f="$d${spec%%:*}"; max=${spec##*:}
              [ -s "$f" ] || { echo "Missing or empty: $f"; exit 1; }
              len=$(python3 -c 'import sys; print(len(open(sys.argv[1], encoding="utf-8").read().rstrip("\n")))' "$f")
              [ "$len" -le "$max" ] || { echo "$f is $len characters, Play allows $max"; exit 1; }
              N=$((N+1))
            done
          done
          [ "$N" -ge 6 ] || { echo "Only $N listing files checked"; exit 1; }
          echo "OK: $N listing files within Play's limits"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Read Gradle version from the wrapper
        id: gradleversion
        run: |
          set -euo pipefail
          V=$(sed -n 's|.*/gradle-\([0-9][^-]*\)-bin\.zip.*|\1|p' android/gradle/wrapper/gradle-wrapper.properties)
          [ -n "$V" ] || { echo "Could not read the Gradle version"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradleversion.outputs.version }}

      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # Chogan's own files come from the submodule; a wrong path would build an
      # app with no games, so the APK is asked what it really carries.
      - name: Check APK contents, package and names
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          unzip -l "$APK" > /tmp/apk.txt
          for f in assets/public/index.html assets/public/games.json assets/public/lib/chogan.js assets/public/privacy-plus.html \
                   assets/capacitor.config.json assets/capacitor.plugins.json; do
            grep -q "$f" /tmp/apk.txt || { echo "Missing from the APK: $f"; exit 1; }
          done
          N=$(grep -c 'assets/public/games/[^/]*/index.html' /tmp/apk.txt)
          [ "$N" -ge 40 ] || { echo "Only $N games in the APK"; exit 1; }
          BADGE=$("$AAPT" dump badging "$APK")
          PKG=$(echo "$BADGE" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          DEF=$(echo "$BADGE" | sed -n "s/^application-label:'\(.*\)'$/\1/p")
          FA=$(echo "$BADGE" | sed -n "s/^application-label-fa:'\(.*\)'$/\1/p")
          [ "$PKG" = "io.github.choganhq.choganplus.debug" ] || { echo "Package is $PKG"; exit 1; }
          [ "$DEF" = "Chogan Plus" ] || { echo "Default name is \"$DEF\""; exit 1; }
          [ "$FA" = "چوگان پلاس" ] || { echo "Persian name is \"$FA\""; exit 1; }
          SC=$("$AAPT" dump xmltree --file res/xml/shortcuts.xml "$APK" | grep -c 'targetPackage.*"io.github.choganhq.chogan"' || true)
          [ "$SC" = 0 ] || { echo "$SC shortcuts still open Chogan"; exit 1; }
          echo "OK: $PKG, $N games, names \"$DEF\" / \"$FA\""

      # Two phones (#4): without the plugins.json entry Capacitor never loads the plugin and the
      # games quietly offer no "Two phones" mode; a new library could also slip in a permission
      # (INTERNET above all) that the store listing and the privacy page say we never ask for.
      - name: Check the Nearby plugin and the permission set
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          DEXDUMP=$(ls "$ANDROID_HOME"/build-tools/*/dexdump | sort -V | tail -n 1)
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          unzip -p "$APK" assets/capacitor.plugins.json | grep -q '"io.github.choganhq.choganplus.NearbyPlugin"' \
            || { echo "capacitor.plugins.json does not register NearbyPlugin"; exit 1; }
          rm -rf /tmp/dex && mkdir /tmp/dex && unzip -q -o "$APK" 'classes*.dex' -d /tmp/dex
          FOUND=0
          for d in /tmp/dex/classes*.dex; do
            "$DEXDUMP" "$d" | grep -q "Lio/github/choganhq/choganplus/NearbyPlugin;" && FOUND=1
          done
          [ "$FOUND" = 1 ] || { echo "NearbyPlugin is not in the APK's code"; exit 1; }
          unzip -p "$APK" assets/public/lib/chogan.js | grep -q 'Chogan.link = makeLink' \
            || { echo "The pinned chogan core has no Chogan.link"; exit 1; }
          GOT=$("$AAPT" dump permissions "$APK" | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" \
            | grep -v 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION$' | sort | tr '\n' ' ')
          WANT=$(printf '%s\n' VIBRATE BLUETOOTH BLUETOOTH_ADMIN BLUETOOTH_ADVERTISE BLUETOOTH_CONNECT \
            BLUETOOTH_SCAN ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_WIFI_STATE CHANGE_WIFI_STATE \
            ACCESS_NETWORK_STATE NEARBY_WIFI_DEVICES | sed 's/^/android.permission./' | sort | tr '\n' ' ')
          [ "$GOT" = "$WANT" ] || { echo "Permissions changed."; echo " got:  $GOT"; echo " want: $WANT"; exit 1; }
          echo "OK: NearbyPlugin registered and compiled, Chogan.link present, $(echo $GOT | wc -w) permissions as listed"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: chogan-plus-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
