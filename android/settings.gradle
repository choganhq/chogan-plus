pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // Kept equal to chogan/android/settings.gradle, so the shared Java code builds the same way.
        id 'com.android.application' version '9.5.0'
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'chogan-plus'
include ':app'
